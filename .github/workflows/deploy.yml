name: Deploy to VDS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, stockfaster]
    env:
      DATABASE_URL: "file:./prod.db"
    steps:
      - uses: actions/checkout@v4

      - name: Sync source to deployment folder
        shell: powershell
        run: |
          robocopy "$env:GITHUB_WORKSPACE" "C:\sites\stockfaster" /MIR `
            /XD .git node_modules dist .next .turbo uploads `
            /XF .env .env.local *.db *.db-journal `
            /R:2 /W:2 /NFL /NDL
          if ($LASTEXITCODE -ge 8) { exit 1 } else { exit 0 }

      - name: Stop services
        shell: powershell
        run: |
          Stop-Service stockfaster-api -ErrorAction SilentlyContinue
          Stop-Service stockfaster-web -ErrorAction SilentlyContinue

      - name: Install dependencies
        working-directory: C:\sites\stockfaster
        shell: powershell
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        working-directory: C:\sites\stockfaster\apps\api
        shell: powershell
        run: pnpm prisma migrate deploy

      - name: Build
        working-directory: C:\sites\stockfaster
        shell: powershell
        run: |
          pnpm --filter @repo/shared-types build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @repo/api build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @repo/web build
          exit $LASTEXITCODE

      - name: Restart services
        shell: powershell
        run: |
          Restart-Service stockfaster-api
          Restart-Service stockfaster-web
